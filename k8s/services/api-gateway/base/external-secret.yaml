# PreSync + wave -1, same as user-service's jwt-secret ExternalSecret —
# without this the Deployment's pods can race ESO's materialization of
# the real Secret on first sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: gateway
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name:           jwt-secret
    creationPolicy: Owner

  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key:      /bookstore/jwt-secret
        property: JWT_SECRET
