apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gateway
data:
  APP_PORT: "3000"
  CATALOG_SERVICE_URL: "http://catalog-service.catalog.svc.cluster.local"
  USER_SERVICE_URL: "http://user-service.user.svc.cluster.local"
  ORDER_SERVICE_URL: "http://order-service.order.svc.cluster.local"
  # The only origin the gateway's CORS policy allows -- substituted by
  # scripts/configure.py the same way k8s/base/ingress/ingress.yaml's host is.
  FRONTEND_URL: "https://bookstore.b17facebook.xyz"
