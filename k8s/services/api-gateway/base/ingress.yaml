apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: gateway
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Shared with k8s/base/ingress/ingress.yaml -- same group.name means the
    # AWS Load Balancer Controller provisions ONE ALB for both Ingress
    # objects, not two. No certificate-arn annotation on purpose -- the
    # controller auto-discovers a matching ACM cert by host, see
    # ../../../../ingress-cert.tf.
    alb.ingress.kubernetes.io/group.name: bookstore
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - api.bookstore.b17facebook.xyz
  rules:
    - host: api.bookstore.b17facebook.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
