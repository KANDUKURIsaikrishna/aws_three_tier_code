apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # No K8s API access needed by this workload -- don't auto-mount a
      # token nothing here uses.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: bookstore-api-gateway:latest
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: jwt-secret, key: JWT_SECRET }
            - name: APP_PORT
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: APP_PORT }
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: CATALOG_SERVICE_URL }
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: USER_SERVICE_URL }
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: ORDER_SERVICE_URL }
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: FRONTEND_URL }
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
