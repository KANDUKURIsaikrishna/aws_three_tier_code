# ─────────────────────────────────────────────────────────────────────────────
# Admin DB credentials, materialized into the catalog namespace
#
# The schema-init PreSync hook Job (schema-init-job.yaml) needs RDS admin
# credentials to create the catalog_db schema and the catalog_user MySQL user.
# Previously this meant a manual `kubectl get secret db-secret -n bookstore |
# kubectl apply -n catalog` step before every deploy. Since ESO's
# ClusterSecretStore is cluster-wide and already scoped to /bookstore/* in IAM,
# pulling the SAME admin secret a second time — into this namespace — removes
# that manual step entirely. No new IAM permissions needed.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-db-secret
  namespace: catalog
  annotations:
    # PreSync + an earlier sync-wave than schema-init-job.yaml — see the same
    # annotation on external-secret.yaml (catalog-db-secret) for why. This
    # secret needs to exist before the Job's very first exec attempt just as
    # much as that one does — see TROUBLESHOOTING.md OBS-013.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name:           admin-db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_HOST
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_HOST

    - secretKey: DB_USERNAME
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_USERNAME

    - secretKey: DB_PASSWORD
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_PASSWORD
