apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db-secret
  namespace: catalog
  annotations:
    # PreSync + an earlier sync-wave than schema-init-job.yaml (which is
    # PreSync, wave "0" by default). ArgoCD runs PreSync hooks strictly
    # before the main Sync phase, in ascending sync-wave order within that
    # phase — without this, the Job (also PreSync) has no guarantee this
    # secret exists yet, since normal Sync-phase resources and PreSync hooks
    # are entirely separate phases. Confirmed live: without this annotation
    # the Job failed with "secret catalog-db-secret not found" /
    # CreateContainerConfigError, retried for 15 minutes, never resolved on
    # its own — see TROUBLESHOOTING.md OBS-013.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name:           catalog-db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key:      /bookstore/catalog-db-credentials
        property: DB_USERNAME

    - secretKey: DB_PASSWORD
      remoteRef:
        key:      /bookstore/catalog-db-credentials
        property: DB_PASSWORD

    - secretKey: DB_HOST
      remoteRef:
        key:      /bookstore/catalog-db-credentials
        property: DB_HOST
