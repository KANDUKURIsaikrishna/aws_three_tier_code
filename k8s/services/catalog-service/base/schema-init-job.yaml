# ─────────────────────────────────────────────────────────────────────────────
# Catalog DB schema bootstrap — ArgoCD PreSync hook
#
# Runs automatically before every sync of the catalog-service Application, no
# manual `kubectl apply` step. ArgoCD hooks are exempt from the normal
# selfHeal/prune diffing that would otherwise fight over a plain Job (Jobs are
# immutable once created — re-applying one is an error, which is exactly why
# this used to be deliberately kept OUT of any kustomize base). The
# hook-delete-policy below deletes the Job after it succeeds, so the next sync
# creates a fresh one under the same name instead of colliding with a
# completed one.
#
# The SQL itself is already idempotent (CREATE DATABASE/TABLE/USER IF NOT
# EXISTS, INSERT ... ON DUPLICATE KEY UPDATE) — safe to actually run on every
# sync, not just the first one.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-schema-init
  namespace: catalog
  annotations:
    argocd.argoproj.io/hook: PreSync
    # BeforeHookCreation added after a real stuck-forever incident: with only
    # HookSucceeded, a hook that FAILS is never cleaned up (that policy only
    # fires on success) — every subsequent sync just keeps waiting on the
    # same permanently-broken Job instead of retrying, since ArgoCD sees a
    # same-name hook resource already exists. BeforeHookCreation deletes the
    # previous hook resource before creating a new one on every sync attempt,
    # regardless of whether it previously succeeded or failed — matches this
    # Job's own idempotent-SQL design intent (safe to actually re-run every
    # sync). See TROUBLESHOOTING.md OBS-015.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      # Matches network-policy.yaml's catalog-service-policy podSelector —
      # without this label, the namespace's default-deny-all NetworkPolicy
      # blocks this pod's egress to RDS (it wouldn't match any allow rule).
      labels:
        app: catalog-service
    spec:
      # No K8s API access needed by this workload -- don't auto-mount a
      # token nothing here uses.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: schema-init
          image: mysql:8.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              # Backticks below are escaped (\`) on purpose — this heredoc is
              # UNQUOTED (<<SQL, not <<'SQL') so that $CATALOG_DB_PASSWORD
              # expands (see TROUBLESHOOTING.md OBS-003). An unquoted heredoc
              # ALSO treats bare backticks as shell command substitution, not
              # literal characters — confirmed live: unescaped `desc` in the
              # SQL below ran as the shell command `desc` three times ("sh:
              # desc: command not found"), silently stripping the identifier
              # from every statement that used it. \` is a literal backtick
              # to the shell; MySQL still sees `desc` as a quoted identifier.
              # See TROUBLESHOOTING.md OBS-017.
              mysql -h "$ADMIN_DB_HOST" -u "$ADMIN_DB_USERNAME" -p"$ADMIN_DB_PASSWORD" <<SQL
              CREATE DATABASE IF NOT EXISTS catalog_db;

              CREATE TABLE IF NOT EXISTS catalog_db.books (
                id INT AUTO_INCREMENT PRIMARY KEY,
                title VARCHAR(255) NOT NULL,
                \`desc\` TEXT,
                price DECIMAL(10,2) NOT NULL,
                cover VARCHAR(1024)
              );

              -- Default catalog seed -- restored after the old monolith
              -- (which used to own this data, in its own test.books table)
              -- was fully deleted (commit 6e57f01) with nothing carrying its
              -- seed rows forward. This job previously only tried to
              -- MIGRATE from that monolith's table on a one-time cutover
              -- assumption; now that the monolith is permanently gone,
              -- test.books never exists again, so that migration was
              -- silently a no-op forever -- a fresh catalog_db.books came up
              -- empty on every apply, with no default books ever appearing.
              -- Guarded on the table being genuinely EMPTY, not just
              -- "missing these two titles": this runs on every sync (see
              -- this file's own top comment), and an admin deliberately
              -- deleting a default book should stay deleted, not get
              -- silently re-inserted on the next sync.
              SET @book_count := (SELECT COUNT(*) FROM catalog_db.books);
              SET @seed_sql := IF(@book_count = 0,
                'INSERT INTO catalog_db.books (title, \`desc\`, price, cover) VALUES (''The Great Gatsby'', ''A novel by F. Scott Fitzgerald'', 12.99, ''https://covers.openlibrary.org/b/id/8432472-L.jpg''), (''To Kill a Mockingbird'', ''A novel by Harper Lee'', 10.99, ''https://covers.openlibrary.org/b/id/8810494-L.jpg'')',
                'SELECT 1');
              PREPARE seed_stmt FROM @seed_sql;
              EXECUTE seed_stmt;
              DEALLOCATE PREPARE seed_stmt;

              CREATE USER IF NOT EXISTS 'catalog_user'@'%' IDENTIFIED BY '$CATALOG_DB_PASSWORD';
              GRANT SELECT, INSERT, UPDATE, DELETE ON catalog_db.* TO 'catalog_user'@'%';
              FLUSH PRIVILEGES;
              SQL
          env:
            - name: ADMIN_DB_HOST
              valueFrom:
                secretKeyRef: { name: admin-db-secret, key: DB_HOST }
            - name: ADMIN_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: admin-db-secret, key: DB_USERNAME }
            - name: ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: admin-db-secret, key: DB_PASSWORD }
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: catalog-db-secret, key: DB_PASSWORD }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
