apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
- storageclass/gp3.yaml
- namespace.yaml
- cert-manager/cluster-issuer.yaml
- configmaps/backend-config.yaml
- secrets/external-secret.yaml
- backend/rollout.yaml
- backend/service.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- ingress/ingress.yaml
- network-policy/network-policy.yaml
- pdb/pdb.yaml
- quota.yaml
- monitoring/analysis-template.yaml
# monitoring/servicemonitor.yaml and monitoring/prometheus-rules.yaml
# deliberately NOT included: monitoring.coreos.com/v1 CRDs (ServiceMonitor,
# PrometheusRule) require the Prometheus Operator, which this cluster does not
# run — Prometheus lives on a standalone EC2 instance instead (see
# ARCHITECTURE.md). These aren't just inert, they actively FAIL an ArgoCD
# sync: the K8s API can't validate an unknown resource type at all, and that
# blocks the ENTIRE sync batch, not just these two resources — confirmed live
# (ComparisonError/SyncFailed on a real bookstore Application, see
# TROUBLESHOOTING.md OBS-012). analysis-template.yaml stays — it's
# argoproj.io/v1alpha1 (Argo Rollouts' own CRD, which IS installed).
