apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
  namespace: bookstore
spec:
  args:
  - name: ingress-name
    value: bookstore-ingress
  metrics:
  - name: error-rate
    interval: 30s
    # Bounded — Argo Rollouts rejects a metric with `interval` set but no
    # `count` as "runs indefinitely" (InvalidSpec, confirmed live — this
    # field was simply missing, blocked the backend Rollout from creating
    # any pods at all). 2 samples at 30s roughly matches the Rollout's own
    # pause durations at each analysis step.
    count: 2
    # Fail rollout if 5xx rate exceeds 1% over 2-minute window
    failureLimit: 2
    successCondition: result[0] < 0.01
    provider:
      prometheus:
        # Was kube-prometheus-stack-prometheus.monitoring.svc.cluster.local —
        # an in-cluster Service that hasn't existed since TF-006 moved
        # monitoring to a standalone EC2 instance (see ARCHITECTURE.md).
        # Real address below (terraform output prometheus_url). The query's
        # `or vector(0)`/`or vector(1)` fallbacks mean this returns a benign
        # 0%-error-rate result even before ingress-nginx metrics are actually
        # scraped by the EC2 Prometheus (not wired up yet — see
        # FUTURE_IMPROVEMENTS.md's observability-extension item) — this
        # unblocks the Rollout, it doesn't yet make the analysis meaningful.
        address: http://13.57.1.221:9090
        query: |
          (
            sum(rate(nginx_ingress_controller_requests{status=~"5..",ingress="{{args.ingress-name}}"}[2m]))
            or vector(0)
          )
          /
          (
            sum(rate(nginx_ingress_controller_requests{ingress="{{args.ingress-name}}"}[2m]))
            or vector(1)
          )
