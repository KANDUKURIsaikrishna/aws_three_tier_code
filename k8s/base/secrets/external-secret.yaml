# ─────────────────────────────────────────────────────────────────────────────
# External Secrets Operator — DB Credentials
#
# Prerequisites:
#   1. External Secrets Operator installed in the cluster:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#
#   2. A service account with IRSA (IAM Roles for Service Accounts) that has
#      secretsmanager:GetSecretValue on the path below:
#        arn:aws:secretsmanager:<region>:<account>:secret:/bookstore/db-credentials-*
#
#   3. The secret stored in AWS Secrets Manager at:
#        /bookstore/db-credentials
#      with JSON body:
#        { "DB_USERNAME": "admin", "DB_PASSWORD": "<strong-password>" }
#
# The ESO controller reconciles every hour and rotates the k8s Secret
# automatically when the value changes in Secrets Manager.
# No credentials are stored in git or passed through the pipeline.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  annotations:
    # Must exist before ANY ExternalSecret's PreSync hook runs (this file's
    # own db-secret at wave -1, and every microservice's own ExternalSecret
    # at the same wave). Without a hook annotation this is a plain Sync-phase
    # resource, which ArgoCD always applies AFTER every PreSync hook — on a
    # genuinely fresh cluster that guarantees every ExternalSecret fails its
    # first reconcile with "could not get ClusterSecretStore ... not found",
    # every time, not just a race. See TROUBLESHOOTING.md OBS-030.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-1
      auth:
        jwt:
          serviceAccountRef:
            name:      external-secrets-sa
            namespace: external-secrets

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: bookstore
  annotations:
    # PreSync + an earlier sync-wave than database/schema-init-job.yaml
    # (also PreSync, default wave "0"). Same fix as catalog-service's
    # admin-db-secret/catalog-db-secret — without this the Job has no
    # guarantee this secret exists yet, since PreSync hooks and normal
    # Sync-phase resources are separate phases. See TROUBLESHOOTING.md
    # OBS-013.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name:           db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_USERNAME

    - secretKey: DB_PASSWORD
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_PASSWORD

    - secretKey: DB_HOST
      remoteRef:
        key:      /bookstore/db-credentials
        property: DB_HOST
