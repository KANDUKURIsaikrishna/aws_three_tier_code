# Default deny all ingress + egress in bookstore namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bookstore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Frontend: accept from ingress-nginx only; send to DNS only.
# (Used to also allow egress to the old backend monolith on :3000 — deleted
# along with it. The frontend SPA's API calls happen from the user's browser
# straight to api-gateway over the internet, not from this pod server-side,
# so no backend/api-gateway egress rule was ever needed here.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: bookstore
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
